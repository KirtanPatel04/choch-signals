<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHoCH Trade Study</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0f1117;--panel:#171a23;--line:#262b38;--text:#e6e8ee;--muted:#8a91a3;--win:#26a69a;--loss:#ef5350;--entry:#4f8cff;--level:#ff9800;--sel:#222838}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:12px 16px 8px;display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline}
h1{font-size:17px;margin:0}
.stat{color:var(--muted)} .stat b{color:var(--text)}
#cal{display:flex;gap:4px;padding:0 16px 10px;border-bottom:1px solid var(--line);overflow-x:auto}
.day{min-width:58px;padding:5px 6px;border-radius:6px;background:var(--panel);cursor:pointer;text-align:center;font-size:12px;border:1px solid transparent}
.day b{display:block;font-size:13px;font-variant-numeric:tabular-nums}
.day.up b{color:var(--win)} .day.dn b{color:var(--loss)} .day.none{opacity:.45;cursor:default}
.day.sel{border-color:var(--entry)}
main{flex:1;display:flex;min-height:0}
#list{width:310px;overflow-y:auto;border-right:1px solid var(--line)}
.item{padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:26px 1fr auto;gap:2px 8px}
.item:hover{background:var(--panel)} .item.sel{background:var(--sel);box-shadow:inset 3px 0 var(--entry)}
body.firstonly .item.second{display:none}
.num{color:var(--muted)} .when{font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:var(--muted);grid-column:2}
.mk{font-weight:600;color:var(--text)} .tier{font-size:11px;padding:0 5px;border-radius:4px;border:1px solid var(--line);margin-left:4px}
.badge{font-size:12px;font-weight:600;padding:1px 7px;border-radius:9px;align-self:center;grid-row:1/3;grid-column:3;font-variant-numeric:tabular-nums}
.pos{background:#26a69a33;color:var(--win)} .neg{background:#ef535033;color:var(--loss)}
#right{flex:1;display:flex;flex-direction:column;min-width:0}
#chart{flex:1;min-height:300px}
#info{border-top:1px solid var(--line);padding:12px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 24px}
#info h2{font-size:15px;margin:0 0 4px;grid-column:1/-1}
.row{display:flex;justify-content:space-between;gap:8px;color:var(--muted)} .row b{color:var(--text);font-variant-numeric:tabular-nums;text-align:right}
.check{color:var(--muted)} .check::before{content:"✓ ";color:var(--win)}
@media (max-width:760px){main{flex-direction:column} #list{width:auto;max-height:30vh;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>

</header>
<div id="cal"></div>
<main>
  <div id="list"></div>
  <div id="right"><div id="chart"></div><div id="info"></div></div>
</main>

  pl(s.entry,"#4f8cff","Entry"); pl(s.stop,"#ef5350","Stop"); pl(s.target,"#26a69a",`Target ${ST.target_r}R`);
  if(s.level!=null) pl(s.level,"#ff9800",(ST.tf===15?"1H":"15M")+" level",2);
  const mk=[{time:s.t_ext,position:up?"belowBar":"aboveBar",color:"#ff9800",shape:up?"arrowUp":"arrowDown",text:"Push into level"},
            {time:s.t_choch,position:up?"aboveBar":"belowBar",color:"#e6e8ee",shape:"circle",text:"CHoCH"},
            {time:s.t_fill,position:up?"belowBar":"aboveBar",color:"#4f8cff",shape:up?"arrowUp":"arrowDown",text:"Filled"},
            {time:s.t_exit,position:"aboveBar",color:s.r>0?"#26a69a":"#ef5350",shape:"square",
             text:s.exit_text||(s.status==="target"?"Target hit":s.status==="stop"?"Stopped":s.status==="breakeven"?"Breakeven":s.status==="skipped"?"Skipped":"Closed "+s.r+"R")}];
  cs.setMarkers(mk.filter(m=>m.time!=null).sort((a,b)=>a.time-b.time));
  const pad=(ST.pad||40)*60; chart.timeScale().setVisibleRange({from:s.t_ext-pad,to:Math.max(s.t_exit,s.t_sig+3600)+pad/2});
  const pv=s.pv||{MES:5,MNQ:2,MYM:0.5}[s.market];
  $("info").innerHTML=`<h2>#${s.n} · ${s.market}${s.desc?" ("+s.desc+")":""} ${s.tier} ${s.side} · ${s.time} CT · trade ${s.nth} of the day</h2>
   <div><div class="row">Entry (limit, middle of the FVG)<b>${fx(s.entry,s)}</b></div>
        <div class="row">Stop (past the push)<b>${fx(s.stop,s)}</b></div>
        <div class="row">Target (${ST.target_r}R)<b>${fx(s.target,s)}</b></div>
        <div class="row">Stop distance<b>${fx(s.risk,s)} pt · $${(s.risk*pv).toFixed(2)} per contract</b></div></div>
   <div><div class="row">Result<b>${s.note?s.note:s.status==="skipped"?"skipped (1 contract > 10% of balance)":`${sgn(s.r)}R = ${money(s.usd)} after commission`}</b></div>${s.bal!=null?`<div class="row">Account after this trade<b>$${s.bal.toLocaleString(undefined,{maximumFractionDigits:0})}</b></div>`:""}
        <div class="row">Size<b>${s.whole} ${s.market} contracts = $${s.risked.toFixed(0)} risk</b></div>
        <div class="row">15M level touched<b>${fx(s.level,s)}</b></div>
        <div class="row">CHoCH candle size<b>${s.strength}x avg range</b></div></div>
   <div><div class="check">Pushed into a ${ST.tf===15?"1H":"15M"} swing level${ST.tiers.includes("fixed")?` (${up?"dropped":"rallied"} into it over the prior 15 candles)`:ST.approach?` (${up?"dropped":"rallied"} into it over the prior ${ST.approach} candles)`:""}</div>
        <div class="check">Not at the previous day's high / low</div>
        <div class="check">With the ${ST.tf===15?"1H":"15M"} structure trend (${up?"bullish":"bearish"})</div>
        <div class="check">CHoCH candle ≥ ${ST.min_disp??(s.tier==="A+"?"1.5":s.tier==="A"?"1.2":"1.0")}x average range (${s.tier}), left an FVG</div></div>`;
}
const visible=k=>!$("firstonly").checked||SETUPS[k].nth===1;
const step=d=>{let k=cur+d; while(SETUPS[k]&&!visible(k)) k+=d; show(k);};
$("list").onclick=e=>{const it=e.target.closest(".item"); if(it) show(+it.dataset.k);};
$("cal").onclick=e=>{const c=e.target.closest(".day"); if(!c) return;
  const k=SETUPS.findIndex((s,i)=>s.day===c.dataset.day&&visible(i)); if(k>=0) show(k);};
$("firstonly").onchange=()=>{document.body.classList.toggle("firstonly",$("firstonly").checked); header();
  if(!visible(cur)) step(-1); else show(cur);};
document.onkeydown=e=>{if(e.key==="ArrowDown"){step(1);e.preventDefault()} if(e.key==="ArrowUp"){step(-1);e.preventDefault()}};
header(); show(0);
</script>
</body>
</html>
